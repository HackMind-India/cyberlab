<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CyberLab India</title>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    background:#050807;
    color:#d9ffe5;
    font-family:Arial,sans-serif;
}
header{
    padding:25px 15px;
    text-align:center;
    background:#081b10;
    border-bottom:1px solid #19ff75;
}
h1{
    margin:0;
    color:#19ff75;
    letter-spacing:2px;
}
.container{
    max-width:900px;
    margin:25px auto;
    padding:15px;
}
.card{
    background:#0b1510;
    border:1px solid #164f2c;
    border-radius:12px;
    padding:20px;
    margin-bottom:15px;
}
.card h2{color:#19ff75}
button{
    background:#19ff75;
    color:#001b09;
    border:0;
    padding:10px 16px;
    border-radius:7px;
    font-weight:bold;
}
small{color:#91b89e}
</style>
</head>

<body>

<header>
    <h1>☠ CYBERLAB INDIA</h1>
    <p>Safe Cyber Security Practice Lab</p>
</header>

<div class="container">

<div class="card">
    <h2>🌐 HTTP Requests</h2>
    <p>Learn how browsers communicate with web servers.</p>
    <button>Open Lab</button>
</div>

<div class="card">
    <h2>🔐 Security Basics</h2>
    <p>Practice authentication, headers and basic web security concepts.</p>
    <button>Start Practice</button>
</div>

<div class="card">
    <h2>💻 Linux Basics</h2>
    <p>Learn safe Linux commands inside your own practice environment.</p>
    <button>Learn</button>
</div>

</div>

</body>
</html>
